name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run desktop:build:mac:x64
          - os: macos-latest
            artifact: macos-arm64
            command: npm run desktop:build:mac:arm64
          - os: windows-latest
            artifact: windows
            command: npm run desktop:build:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS native architecture
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "macos-x64" ]; then expected=x64; else expected=arm64; fi
          found=$(find dist -type d -path '*@img/sharp-darwin-*' -exec basename {} \; | sort -u | tr '\n' ' ')
          echo "sharp natives: $found"
          case "$found" in
            *"sharp-darwin-$expected"*) ;;
            *) echo "missing sharp-darwin-$expected"; exit 1 ;;
          esac
      - name: Verify macOS DMG integrity
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            if hdiutil verify "$dmg"; then
              continue
            fi
            echo "DMG checksum invalid, rebuilding: $dmg"
            app=$(find dist -maxdepth 2 -type d -name 'Luma.app' | head -1)
            test -n "$app"
            staging=$(mktemp -d)
            ditto "$app" "$staging/Luma.app"
            ln -s /Applications "$staging/Applications"
            rm -f "$dmg"
            hdiutil create -volname "Luma" -srcfolder "$staging" -ov -format UDZO "$dmg"
            rm -rf "$staging"
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Inspect assets
        run: ls -lh release-assets
      - name: Verify downloaded DMG integrity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          test ${#dmgs[@]} -eq 2
          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done
      - name: Remove non-installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              for (const asset of release.assets) {
                if (!/\.(dmg|exe)$/i.test(asset.name)) {
                  core.info(`Deleting ${asset.name}`);
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing release');
            }
      - uses: softprops/action-gh-release@v2
        with:
          name: Luma v1.0.6
          body: |
            ## Luma v1.0.6

            ### 新增

            - 对话附件：支持上传 txt / Markdown / CSV / JSON / Word (.docx) / Excel (.xlsx) / PPT (.pptx) / PDF；服务端提取文字后随消息进入上下文，可直接总结、分析或据此生成图片
            - 会话文档：在对话中把会话整理成 Word / PDF 终稿，生成后进入「我的文档」，支持预览、下载和删除；默认生成 Word，只有明确要求 PDF 时才生成 PDF
            - 会话导出 / 导入：导出为 `.luma-session.zip`，包含消息、附件文字和图片；导入后自动创建新会话并更换图片 ID，不覆盖现有会话

            ### 改进

            - 附件文字按预算截断并明确标注；Excel 按工作表和制表符分列输出，避免长表格撑爆上下文
            - 文档生成先规划读者与章节，只收录最终确认的文字和图片；画册中移除的图片不会写入文档
            - PDF 导出自动查找系统中文字体；Docker 镜像补充 fontconfig 与 Noto CJK
            - 上传文档增加格式、扩展名、文件头和大小校验，失败时返回明确错误
            - 会话导入校验 ZIP、manifest、图片签名和体积，重新映射图片、参考图与父子关系

            ### 限制

            - 扫描版 PDF 需要先 OCR；附件解析只使用可提取的文字
            - 会话导出不包含原始附件文件，保留提取后的文字
            - 单个会话文件上限 96MB，最多 1000 条消息、500 张图片

            ### 更新方式

            1. 打开「版本更新」，选择对应平台的安装包下载
            2. macOS：打开 DMG，将「Luma」拖入 Applications，覆盖旧版本
            3. Windows：运行 EXE 安装包，按提示覆盖安装
            4. Release 仅提供安装包，不包含自动更新元数据或 blockmap

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS Apple Silicon（M 系列） | `Luma-1.0.6-mac-arm64.dmg` |
            | macOS Intel | `Luma-1.0.6-mac-x64.dmg` |
            | Windows x64 | `Luma-1.0.6-win-x64.exe` |

            ### 安装说明

            - macOS：打开 DMG，将「Luma」拖入 Applications。
              当前构建未做 Apple 公证；如首次打开被 Gatekeeper 拦截，请右键应用选择「打开」，或执行：
              `xattr -dr com.apple.quarantine /Applications/Luma.app`
            - Windows：运行 EXE 安装包。当前构建未做代码签名；如出现 SmartScreen 提示，选择「更多信息」→「仍要运行」。
            - 应用不内置任何 API Key，模型费用由使用者自己的 API 账户承担。
            - 首次使用必须在「模型设置」中自行填写接口地址、模型名称和 Key，不提供默认值。

            ### 系统要求

            - macOS 12 或更高版本
            - Windows 10/11 x64
          files: |
            release-assets/*.dmg
            release-assets/*.exe
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
