name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run desktop:build:mac:x64
          - os: macos-15
            artifact: macos-arm64
            command: npm run desktop:build:mac:arm64
          - os: windows-latest
            artifact: windows
            command: npm run desktop:build:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Inspect assets
        run: ls -lh release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: Luma v1.0.3
          body: |
            ## Luma v1.0.3

            对话式 AI 助手，支持自然对话与图片生成。

            ### 本版新增

            - AI 运营物料生成器：可选择或上传参考图，保留参考版式与视觉语言，按新主题替换主体、文案和二维码
            - 内置 10 张运营参考图库（Banner、海报、弹窗、封面、信息流、启动页）
            - 新增「画面主体」输入；未填写时按标题自动推断，默认替换参考图中的商品、饮料、人物等主体，避免只换文案不换主体
            - 生成结果自动进入「我的画册」

            ### 基础能力

            - 普通对话改为流式输出，回复逐字显示
            - 支持安全 Markdown 渲染：标题、列表、粗体、代码块和链接
            - 优化意图判断：普通问答直接回答，不再强行引向出图
            - 图片生成与修改仍保留流式状态和工具调用
            - 网络异常、超时和 5xx 自动重试（最多 5 次），失败统一提示
            - 图片输出后，说明文字继续在图片下方显示
            - 支持 OpenAI / Anthropic 兼容协议，并可在设置中读取模型列表
            - 应用内支持检查新版本
            - 桌面端支持应用内下载更新，下载完成后重启安装

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS Apple Silicon（M 系列） | `Luma-1.0.3-mac-arm64.dmg` |
            | macOS Intel | `Luma-1.0.3-mac-x64.dmg` |
            | Windows x64 | `Luma-1.0.3-win-x64.exe` |

            ### 安装说明

            - macOS：打开 DMG，将「Luma」拖入 Applications。
              当前构建未做 Apple 公证；如首次打开被 Gatekeeper 拦截，请右键应用选择「打开」，或执行：
              `xattr -dr com.apple.quarantine /Applications/Luma.app`
            - Windows：运行 EXE 安装包。当前构建未做代码签名；如出现 SmartScreen 提示，选择「更多信息」→「仍要运行」。
            - 桌面端自动更新：macOS 需要 Developer ID 签名并完成公证，否则可能回退为手动下载覆盖安装；Windows 未签名构建也可能触发 SmartScreen。
            - 应用不内置任何 API Key，模型费用由使用者自己的 API 账户承担。
            - 首次使用必须在「模型设置」中自行填写接口地址、模型名称和 Key，不提供默认值。

            ### 系统要求

            - macOS 12 或更高版本
            - Windows 10/11 x64
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.zip
            release-assets/latest*.yml
            release-assets/*.blockmap
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
