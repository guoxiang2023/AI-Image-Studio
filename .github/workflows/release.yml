name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run desktop:build:mac:x64
          - os: macos-latest
            artifact: macos-arm64
            command: npm run desktop:build:mac:arm64
          - os: windows-latest
            artifact: windows
            command: npm run desktop:build:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS native architecture
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "macos-x64" ]; then expected=x64; else expected=arm64; fi
          found=$(find dist -type d -path '*@img/sharp-darwin-*' -exec basename {} \; | sort -u | tr '\n' ' ')
          echo "sharp natives: $found"
          case "$found" in
            *"sharp-darwin-$expected"*) ;;
            *) echo "missing sharp-darwin-$expected"; exit 1 ;;
          esac
      - name: Verify macOS DMG integrity
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            if hdiutil verify "$dmg"; then
              continue
            fi
            echo "DMG checksum invalid, rebuilding: $dmg"
            app=$(find dist -maxdepth 2 -type d -name 'Luma.app' | head -1)
            test -n "$app"
            staging=$(mktemp -d)
            ditto "$app" "$staging/Luma.app"
            ln -s /Applications "$staging/Applications"
            rm -f "$dmg"
            hdiutil create -volname "Luma" -srcfolder "$staging" -ov -format UDZO "$dmg"
            rm -rf "$staging"
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Inspect assets
        run: ls -lh release-assets
      - name: Verify downloaded DMG integrity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          test ${#dmgs[@]} -eq 2
          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done
      - name: Remove non-installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              for (const asset of release.assets) {
                if (!/\.(dmg|exe)$/i.test(asset.name)) {
                  core.info(`Deleting ${asset.name}`);
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing release');
            }
      - uses: softprops/action-gh-release@v2
        with:
          name: Luma v1.0.7
          body: |
            ## Luma v1.0.7

            ### 修复

            - 修复文档生成在较高推理等级下必然失败的问题：4,000 / 6,000 的输出 token 上限不足以容纳推理模型隐藏的推理过程，策划 JSON 或正文会被截断，随后被误判为“模型没有返回有效的终稿计划”
            - 文档策划输出上限提升到 12,000，正文输出上限提升到 16,000，覆盖 DeepSeek、Claude 等推理模型的思考与正文消耗
            - 模型输出确实达到 token 上限时，返回明确的截断错误，不再显示含糊的策划失败信息

            ### 说明

            - 文档服务本身没有宕机；Word / PDF 生成链路和「我的文档」保持不变
            - 若使用的模型输出上限更低，请在「模型设置」中降低推理等级后重试

            ### 更新方式

            1. 打开「版本更新」，选择对应平台的安装包下载
            2. macOS：打开 DMG，将「Luma」拖入 Applications，覆盖旧版本
            3. Windows：运行 EXE 安装包，按提示覆盖安装
            4. Release 仅提供安装包，不包含自动更新元数据或 blockmap

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS Apple Silicon（M 系列） | `Luma-1.0.7-mac-arm64.dmg` |
            | macOS Intel | `Luma-1.0.7-mac-x64.dmg` |
            | Windows x64 | `Luma-1.0.7-win-x64.exe` |

            ### 安装说明

            - macOS：打开 DMG，将「Luma」拖入 Applications。
              当前构建未做 Apple 公证；如首次打开被 Gatekeeper 拦截，请右键应用选择「打开」，或执行：
              `xattr -dr com.apple.quarantine /Applications/Luma.app`
            - Windows：运行 EXE 安装包。当前构建未做代码签名；如出现 SmartScreen 提示，选择「更多信息」→「仍要运行」。
            - 应用不内置任何 API Key，模型费用由使用者自己的 API 账户承担。
            - 首次使用必须在「模型设置」中自行填写接口地址、模型名称和 Key，不提供默认值。

            ### 系统要求

            - macOS 12 或更高版本
            - Windows 10/11 x64
          files: |
            release-assets/*.dmg
            release-assets/*.exe
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
