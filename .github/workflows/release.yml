name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run desktop:build:mac:x64
          - os: macos-latest
            artifact: macos-arm64
            command: npm run desktop:build:mac:arm64
          - os: windows-latest
            artifact: windows
            command: npm run desktop:build:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS native architecture
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "macos-x64" ]; then expected=x64; else expected=arm64; fi
          found=$(find dist -type d -path '*@img/sharp-darwin-*' -exec basename {} \; | sort -u | tr '\n' ' ')
          echo "sharp natives: $found"
          case "$found" in
            *"sharp-darwin-$expected"*) ;;
            *) echo "missing sharp-darwin-$expected"; exit 1 ;;
          esac
      - name: Verify macOS DMG integrity
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            if hdiutil verify "$dmg"; then
              continue
            fi
            echo "DMG checksum invalid, rebuilding: $dmg"
            app=$(find dist -maxdepth 2 -type d -name 'Luma.app' | head -1)
            test -n "$app"
            staging=$(mktemp -d)
            ditto "$app" "$staging/Luma.app"
            ln -s /Applications "$staging/Applications"
            rm -f "$dmg"
            hdiutil create -volname "Luma" -srcfolder "$staging" -ov -format UDZO "$dmg"
            rm -rf "$staging"
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Inspect assets
        run: ls -lh release-assets
      - name: Verify downloaded DMG integrity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          test ${#dmgs[@]} -eq 2
          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done
      - name: Remove non-installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              for (const asset of release.assets) {
                if (!/\.(dmg|exe)$/i.test(asset.name)) {
                  core.info(`Deleting ${asset.name}`);
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing release');
            }
      - uses: softprops/action-gh-release@v2
        with:
          name: Luma v1.0.7
          body: |
            ## Luma v1.0.7

            ### 对话

            - 每条消息显示发送时间；助手回复显示本轮用时，生成过程中按秒实时计时
            - 会话生成期间可以切换其他会话或新建对话，生成在后台继续；回到原会话会回放流式内容、状态和已生成图片

            ### 文档生成

            - 改为“完整对话 → 分块事实摘要 → 语义归并 → 总—分—总大纲 → 逐章生成”，长对话不再被滚动摘要或单次上下文预算截断
            - 每章只携带相关对话片段，数据库章节优先保留字段表；输出预算拆分为大纲 2,048 / 导语 2,048 / 章节 4,096 tokens，并显式关闭 Anthropic 兼容网关的隐藏 thinking
            - 大纲或配图请求失败时自动降级为确定性大纲、已筛选候选图；章节截断自动续写，仍超限时保留已生成部分；总超时提升到 600 秒
            - Word、PDF 与文档预览支持 Markdown 表格，数据字典、接口字段可直接成表
            - 文档默认标题由「Luma 文档」改为「文档」，DOCX 不再写入 Luma 作者与标题元数据

            ### 修复

            - 修复切换会话或新建对话会中止正在生成的回复、并让流式进度丢失的问题；生成状态改为按会话保留

            ### 说明

            - 本次以相同版本号 1.0.7 重新构建并覆盖今日发布的同名安装包；已安装 1.0.7 的用户重新下载覆盖安装即可
            - 若使用的模型输出上限更低，请在「模型设置」中降低推理等级后重试

            ### 更新方式

            1. 打开「版本更新」，选择对应平台的安装包下载
            2. macOS：打开 DMG，将「Luma」拖入 Applications，覆盖旧版本
            3. Windows：运行 EXE 安装包，按提示覆盖安装
            4. Release 仅提供安装包，不包含自动更新元数据或 blockmap

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS Apple Silicon（M 系列） | `Luma-1.0.7-mac-arm64.dmg` |
            | macOS Intel | `Luma-1.0.7-mac-x64.dmg` |
            | Windows x64 | `Luma-1.0.7-win-x64.exe` |

            ### 安装说明

            - macOS：打开 DMG，将「Luma」拖入 Applications。
              当前构建未做 Apple 公证；如首次打开被 Gatekeeper 拦截，请右键应用选择「打开」，或执行：
              `xattr -dr com.apple.quarantine /Applications/Luma.app`
            - Windows：运行 EXE 安装包。当前构建未做代码签名；如出现 SmartScreen 提示，选择「更多信息」→「仍要运行」。
            - 应用不内置任何 API Key，模型费用由使用者自己的 API 账户承担。
            - 首次使用必须在「模型设置」中自行填写接口地址、模型名称和 Key，不提供默认值。

            ### 系统要求

            - macOS 12 或更高版本
            - Windows 10/11 x64
          files: |
            release-assets/*.dmg
            release-assets/*.exe
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
