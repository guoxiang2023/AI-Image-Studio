name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run desktop:build:mac:x64
          - os: macos-latest
            artifact: macos-arm64
            command: npm run desktop:build:mac:arm64
          - os: windows-latest
            artifact: windows
            command: npm run desktop:build:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          # Keyed only by platform: the Electron version comes from
          # package-lock.json, and a stale entry is still a valid zip to reuse.
          key: electron-${{ runner.os }}-${{ runner.arch }}
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # A stalled Electron download is cut off after electron-builder's
          # 10-minute request timeout, which is what failed the arm64 job.
          # Keep the mirror and give each runner a warm cache.
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
      - name: Verify macOS native architecture
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "macos-x64" ]; then expected=x64; else expected=arm64; fi
          found=$(find dist -type d -path '*@img/sharp-darwin-*' -exec basename {} \; | sort -u | tr '\n' ' ')
          echo "sharp natives: $found"
          case "$found" in
            *"sharp-darwin-$expected"*) ;;
            *) echo "missing sharp-darwin-$expected"; exit 1 ;;
          esac
      - name: Verify macOS DMG integrity
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            if hdiutil verify "$dmg"; then
              continue
            fi
            echo "DMG checksum invalid, rebuilding: $dmg"
            app=$(find dist -maxdepth 2 -type d -name 'Luma.app' | head -1)
            test -n "$app"
            staging=$(mktemp -d)
            ditto "$app" "$staging/Luma.app"
            ln -s /Applications "$staging/Applications"
            rm -f "$dmg"
            hdiutil create -volname "Luma" -srcfolder "$staging" -ov -format UDZO "$dmg"
            rm -rf "$staging"
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve version
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Inspect assets
        run: ls -lh release-assets
      - name: Verify downloaded DMG integrity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          test ${#dmgs[@]} -eq 2
          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done
      - name: Verify in-app updater assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.number }}"
          for name in "Luma-$version-mac-arm64.dmg" "Luma-$version-mac-x64.dmg" "Luma-$version-win-x64.exe"; do
            test -f "release-assets/$name" || { echo "missing $name"; exit 1; }
          done
          echo "all three installers present for $version"
      - name: Remove non-installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              for (const asset of release.assets) {
                if (!/\.(dmg|exe)$/i.test(asset.name)) {
                  core.info(`Deleting ${asset.name}`);
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing release');
            }
      - uses: softprops/action-gh-release@v2
        with:
          name: Luma ${{ github.ref_name }}
          body: |
            ## Luma ${{ github.ref_name }}

            ### 应用内更新

            - 桌面端可直接在「版本更新」中点击「立即更新并重启」：下载对应平台安装包、校验 SHA-256、静默安装并自动重启，不再需要手动下载覆盖安装
            - macOS 在应用退出后原地替换 `.app`，替换失败自动回滚；安装位置不可写时直接提示手动安装，不做任何提权
            - Windows 以 `/S --updated --force-run` 静默安装，装完自动拉起应用
            - 会话、模型配置与图片保存在本地数据目录，更新不会影响

            ### 说明

            - 校验值取自本 Release 的资产 `digest`；缺少校验值时应用内更新会拒绝执行并提示手动下载
            - 若使用的模型输出上限更低，请在「模型设置」中降低推理等级后重试

            ### 更新方式

            1. 桌面端：打开「版本更新」→「立即更新并重启」，应用会自动完成下载、安装与重启
            2. 如果应用内更新不可用（例如系统策略限制），仍可手动下载对应平台安装包覆盖安装

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS Apple Silicon（M 系列） | `Luma-${{ steps.version.outputs.number }}-mac-arm64.dmg` |
            | macOS Intel | `Luma-${{ steps.version.outputs.number }}-mac-x64.dmg` |
            | Windows x64 | `Luma-${{ steps.version.outputs.number }}-win-x64.exe` |

            ### 安装说明

            - macOS：打开 DMG，将「Luma」拖入 Applications。
              当前构建未做 Apple 公证；如首次打开被 Gatekeeper 拦截，请右键应用选择「打开」，或执行：
              `xattr -dr com.apple.quarantine /Applications/Luma.app`
            - Windows：运行 EXE 安装包。当前构建未做代码签名；如出现 SmartScreen 提示，选择「更多信息」→「仍要运行」。
            - 应用不内置任何 API Key，模型费用由使用者自己的 API 账户承担。
            - 首次使用必须在「模型设置」中自行填写接口地址、模型名称和 Key，不提供默认值。

            ### 系统要求

            - macOS 12 或更高版本
            - Windows 10/11 x64
          files: |
            release-assets/*.dmg
            release-assets/*.exe
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
