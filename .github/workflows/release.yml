name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run desktop:build:mac:x64
          - os: macos-latest
            artifact: macos-arm64
            command: npm run desktop:build:mac:arm64
          - os: windows-latest
            artifact: windows
            command: npm run desktop:build:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS native architecture
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "macos-x64" ]; then expected=x64; else expected=arm64; fi
          found=$(find dist -type d -path '*@img/sharp-darwin-*' -exec basename {} \; | sort -u | tr '\n' ' ')
          echo "sharp natives: $found"
          case "$found" in
            *"sharp-darwin-$expected"*) ;;
            *) echo "missing sharp-darwin-$expected"; exit 1 ;;
          esac
      - name: Verify macOS DMG integrity
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            if hdiutil verify "$dmg"; then
              continue
            fi
            echo "DMG checksum invalid, rebuilding: $dmg"
            app=$(find dist -maxdepth 2 -type d -name 'Luma.app' | head -1)
            test -n "$app"
            staging=$(mktemp -d)
            ditto "$app" "$staging/Luma.app"
            ln -s /Applications "$staging/Applications"
            rm -f "$dmg"
            hdiutil create -volname "Luma" -srcfolder "$staging" -ov -format UDZO "$dmg"
            rm -rf "$staging"
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Inspect assets
        run: ls -lh release-assets
      - name: Verify downloaded DMG integrity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          test ${#dmgs[@]} -eq 2
          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done
      - name: Remove non-installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              for (const asset of release.assets) {
                if (!/\.(dmg|exe)$/i.test(asset.name)) {
                  core.info(`Deleting ${asset.name}`);
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing release');
            }
      - uses: softprops/action-gh-release@v2
        with:
          name: Luma v1.0.4
          body: |
            ## Luma v1.0.4

            对话式 AI 助手，支持自然对话与图片生成。

            ### 本版新增

            - 多供应商管理：对话模型和图片模型均可配置多个供应商，独立保存接口地址、模型、Key、推理等级 / 图片质量与价格，通过顶部模型菜单或设置页「设为当前」一键切换
            - 用量与费用统计：全部时间总览、近 7 天趋势，以及会话、供应商、模型三个维度的 Token、请求、图片与费用明细
            - 缓存命中统计：展示缓存 Token 与缓存命中率；按「供应商 + 模型」分别配置输入、缓存命中和输出单价，历史用量按当前单价重新估算
            - 上下文管理：按 token 预算自动压缩上下文，并新增手动「压缩」按钮，保留长期记忆
            - 兼容 OpenAI 式缓存 usage 与 Anthropic `cache_read_input_tokens`，缓存 Token 单独计价

            ### 改进

            - 设置页供应商表单重构，支持新增、删除、设为当前；每个供应商独立保存配置与 Key
            - 同一供应商下的不同模型可使用不同价格，费用统计更准确
            - 供应商未返回 usage 时继续按消息长度估算，并在统计中标注
            - 图片与对话供应商切换后，当前会话保持可用

            ### 基础能力

            - 普通对话流式输出，回复逐字显示
            - 支持安全 Markdown 渲染：标题、列表、粗体、代码块和链接
            - 优化意图判断：普通问答直接回答，不再强行引向出图
            - 图片生成与修改支持流式状态和工具调用
            - 网络异常、超时和 5xx 自动重试（最多 5 次），失败统一提示
            - 支持 OpenAI / Anthropic 兼容协议，并可在设置中读取模型列表
            - 图片画册、文件夹、标签、收藏、对比，以及会话归档
            - Release 仅提供安装包，不包含自动更新元数据或 blockmap；更新请下载新安装包覆盖安装

            ### 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS Apple Silicon（M 系列） | `Luma-1.0.4-mac-arm64.dmg` |
            | macOS Intel | `Luma-1.0.4-mac-x64.dmg` |
            | Windows x64 | `Luma-1.0.4-win-x64.exe` |

            ### 安装说明

            - macOS：打开 DMG，将「Luma」拖入 Applications。
              当前构建未做 Apple 公证；如首次打开被 Gatekeeper 拦截，请右键应用选择「打开」，或执行：
              `xattr -dr com.apple.quarantine /Applications/Luma.app`
            - Windows：运行 EXE 安装包。当前构建未做代码签名；如出现 SmartScreen 提示，选择「更多信息」→「仍要运行」。
            - 应用不内置任何 API Key，模型费用由使用者自己的 API 账户承担。
            - 首次使用必须在「模型设置」中自行填写接口地址、模型名称和 Key，不提供默认值。

            ### 系统要求

            - macOS 12 或更高版本
            - Windows 10/11 x64
          files: |
            release-assets/*.dmg
            release-assets/*.exe
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
